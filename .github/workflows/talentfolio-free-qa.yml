name: Talentfolio free local QA
on:
  pull_request:
    branches: [feature/phase3-premium-ui]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: talentfolio-free-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-qa:
    if: github.repository == 'ferlin070/talent-portfolio-ai' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Install locked application dependencies
        run: npm ci
      - name: Start disposable local Supabase
        run: |
          set -euo pipefail
          unset SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID
          test ! -f supabase/.temp/project-ref
          if [ ! -f supabase/config.toml ]; then
            npx --yes supabase@2.79.0 init
          fi
          npx --yes supabase@2.79.0 start
          npx --yes supabase@2.79.0 db reset --local --no-seed
      - name: Test migration and RLS on localhost only
        run: |
          set -euo pipefail
          PGPASSWORD=postgres psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres -f tests/phase4-local-db.sql
      - name: Build using local API only
        run: |
          set -euo pipefail
          status="$(npx --yes supabase@2.79.0 status -o env)"
          export NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$(printf '%s\n' "$status" | sed -n 's/^ANON_KEY="\(.*\)"$/\1/p')"
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
          npm run build
      - name: Stop disposable stack
        if: always()
        run: |
          unset SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID
          if [ -f supabase/config.toml ]; then
            npx --yes supabase@2.79.0 stop --no-backup
          fi
